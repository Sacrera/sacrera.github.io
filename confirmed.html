<!DOCTYPE html>

<head>

<meta name="robots" content="noindex">

<link rel="icon" type="image/png" href="favicon.png">

<link rel="preload" href="fonts/bona-nova-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="site.css">
<style>
.done{min-height:calc(100svh - 9rem);display:grid;place-items:center;padding:3rem 0 4rem;text-align:center}

.done svg.seed{width:132px;height:132px;margin:0 auto 1.6rem;display:block}

.done p{margin:1rem auto 0;color:var(--muted);max-width:34ch}
.done .acts{margin-top:2rem;display:flex;flex-direction:column;align-items:center;gap:1rem}
.done .small{font-size:var(--fs-s)}

</style>
<script>document.documentElement.classList.replace('no-js','js')</script>
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="brand" href="index.html"><img src="img/logo.svg" alt="" width="34" height="34">Sacrera</a>

</header>

<main class="done">
  <div class="box">
    <svg class="seed" viewBox="-60 -60 120 120" aria-hidden="true" fill="none" stroke="#e2b96c" stroke-width="1.2">
      <circle r="18"/><circle cy="-18" r="18"/><circle cy="18" r="18"/>

    <div class="acts">
      <a class="play" href="paper/Sacrera-Paper-Set.pdf" download>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m0 0l-5-5m5 5l5-5M5 20h14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>Download the Paper Set

      <span class="small muted">A4 · 18 pages · print at actual size</span>
      <a class="small" href="index.html">Back to Sacrera</a>
    </div>
  </div>
</main>

</html>
